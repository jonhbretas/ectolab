# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: jonhbretas/ectolab
  branch: main
  base_url: https://sveltia-cms-auth-ectolab.jonathanbretas.workers.dev
  auth_methods:
    - oauth

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site_images
    label: Imagens do site
    media_folder: public/uploads/site-images
    public_folder: /uploads/site-images
    files:
      - name: images
        label: Todas as imagens
        file: content/site/images.json
        fields:
          - name: pages
            label: Paginas e pastas
            widget: list
            label_singular: Pagina/Pasta
            summary: "{{page}}"
            collapsed: auto
            hint: "Cada grupo representa uma pagina, pasta ou area global do site. Troque a imagem no campo 'Imagem substituta'. Recomendacao: envie arquivos WEBP otimizados para melhorar o desempenho."
            fields:
              - { name: page, label: Pagina ou area, widget: hidden }
              - { name: folder, label: Pasta interna sugerida, widget: hidden }
              - name: images
                label: Imagens desta pagina/pasta
                widget: list
                label_singular: Imagem
                summary: "{{label}}"
                collapsed: true
                fields:
                  - { name: label, label: Nome da imagem, widget: hidden }
                  - { name: originalPath, label: Caminho atual no site, widget: hidden }
                  - { name: image, label: Imagem substituta, widget: image, hint: "Preferir WEBP. Para manter a imagem atual, deixe igual ao caminho atual." }
                  - { name: alt, label: Texto alternativo, widget: string, required: false }
                  - { name: notes, label: Observacoes, widget: text, required: false, default: "Preferir WEBP otimizado para melhor desempenho." }

  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    media_folder: public/uploads/blog
    public_folder: /uploads/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Titulo, widget: string }
      - { name: slug, label: Slug, widget: string }
      - { name: description, label: Descricao, widget: text, required: false }
      - { name: date, label: Data, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: author, label: Autor, widget: string, default: ECTOLAB }
      - { name: category, label: Categoria, widget: string }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: coverImage, label: Imagem de capa, widget: image, required: false }
      - name: bodyImages
        label: Imagens internas do post
        widget: list
        required: false
        label_singular: Imagem
        summary: "{{label}}"
        collapsed: true
        hint: "Use para trocar imagens que aparecem dentro do corpo do artigo. Recomendacao: envie WEBP otimizado."
        fields:
          - { name: label, label: Nome da imagem, widget: hidden }
          - { name: originalPath, label: Caminho atual no artigo, widget: hidden }
          - { name: image, label: Imagem substituta, widget: image, hint: "Preferir WEBP. Para manter a imagem atual, deixe igual ao caminho atual." }
          - { name: alt, label: Texto alternativo, widget: string, required: false }
          - { name: notes, label: Observacoes, widget: text, required: false, default: "Preferir WEBP otimizado para melhor desempenho." }
      - { name: published, label: Publicado, widget: boolean, default: true }
      - { name: featured, label: Destaque, widget: boolean, default: false }
      - name: body
        label: Conteudo HTML
        widget: markdown
        hint: "Pode colar HTML completo otimizado aqui. O gerador preserva o HTML dentro do corpo do post."

  - name: pesquisas
    label: Pesquisas
    label_singular: Pesquisa
    folder: content/pesquisas
    media_folder: public/uploads/pesquisas
    public_folder: /uploads/pesquisas
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title, status]
    fields:
      - { name: title, label: Título da pesquisa, widget: string, hint: "Ex.: Análise da estimulação vagal e sintomas de ectoplasmia." }
      - { name: slug, label: Slug (endereço interno), widget: string, hint: "Use letras minúsculas e hifens. Ex.: estimulacao-vagal-ectoplasmia." }
      - { name: code, label: Código, widget: string, required: false, hint: "Opcional. Código curto exibido no card. Ex.: ECTO-01." }
      - name: status
        label: Status da pesquisa
        widget: select
        default: preparacao
        options:
          - { label: Em preparação, value: preparacao }
          - { label: Recrutamento aberto, value: aberto }
          - { label: Coleta concluída, value: concluida }
      - { name: statusNote, label: Nota do status, widget: string, required: false, hint: "Linha curta abaixo do status. Ex.: Protocolo em ajustes · recrutamento em breve." }
      - { name: researcher, label: Responsável (nome do pesquisador), widget: string, required: false }
      - { name: coverImage, label: Imagem ou arte da pesquisa, widget: image, required: false, hint: "Imagem principal do card (foto do pesquisador trabalhando, arte ou tema). Preferir WEBP na proporção 16:10." }
      - { name: researcherPhoto, label: Foto do pesquisador (retrato), widget: image, required: false, hint: "Opcional. Retrato do responsável, exibido junto ao nome." }
      - { name: summary, label: Descrição / resumo, widget: text, hint: "Resumo curto da pesquisa, exibido no card." }
      - { name: profile, label: Perfil procurado, widget: string, required: false, hint: "Ex.: Adultos interessados em autopesquisa da ectoplasmia." }
      - name: modality
        label: Modalidade
        widget: select
        required: false
        options:
          - { label: Presencial, value: Presencial }
          - { label: Online, value: Online }
          - { label: Híbrida, value: Híbrida }
      - { name: format, label: Formato, widget: string, required: false, hint: "Ex.: Registros e questionários, Protocolo laboratorial." }
      - { name: line, label: Linha de pesquisa, widget: string, required: false, hint: "Ex.: Fisiologia e parafisiologia do ectoplasta." }
      - { name: tags, label: Tags, widget: list, required: false, hint: "Palavras-chave curtas exibidas no card. Ex.: HRV, Sintomas, Autopesquisa." }
      - { name: details, label: Detalhes (texto do botão de detalhes), widget: text, required: false, hint: "Texto exibido quando a pessoa clica em detalhes. Ex.: critérios, rotina de registros, consentimento." }
      - { name: order, label: Ordem de exibição, widget: number, value_type: int, required: false, default: 1, hint: "Menor número aparece primeiro." }
      - { name: published, label: Publicada, widget: boolean, default: true, hint: "Desligue para ocultar a pesquisa do site sem apagá-la." }

  - name: eventos
    label: Agenda · Eventos
    label_singular: Evento
    description: "Cada evento é um arquivo. Para criar: **Novo Evento**, escolha o Modelo e a Data — o resto vem do modelo. Para repetir um evento (ex.: PROEP do mês seguinte), abra um existente e use **Duplicar**. A pré-visualização ao lado mostra o card como vai aparecer no site."
    folder: content/agenda/events
    format: json
    extension: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{model | default('evento')}}"
    summary: "{{date | date('DD/MM/YYYY')}} · {{model | upper | default('SEM MODELO')}} {{title}} — {{status | default('status do modelo')}}"
    sortable_fields:
      fields: [date, model, title, status]
      default:
        field: date
        direction: ascending
    view_filters:
      filters:
        - { name: proximos, label: Próximos, field: date, gte: "{{today}}" }
        - { name: realizados, label: Já realizados, field: date, lt: "{{today}}" }
        - { name: destaques, label: Em destaque, field: featured, pattern: true }
        - { name: home, label: Fixados na Home, field: pinHome, pattern: true }
      default: proximos
    view_groups:
      groups:
        - { name: mes, label: Mês, field: date, pattern: '\d{4}-\d{2}' }
        - { name: modelo, label: Modelo, field: model }
        - { name: status, label: Status, field: status }
      default: mes
    fields:
      # ── Básico ──────────────────────────────────────────────────────────
      - name: model
        label: Modelo do evento
        widget: relation
        collection: agenda
        file: event_models
        value_field: "models.*.id"
        display_fields: ["models.*.label"]
        search_fields: ["models.*.label", "models.*.acronym"]
        required: false
        hint: "**Comece por aqui.** O modelo preenche título, tipo, descrição, local, horário, preço, link e duração. Só preencha os campos abaixo quando algo for **diferente** do modelo. Modelos novos aparecem aqui automaticamente (Agenda · Configurações → Modelos)."
      - name: date
        label: Data de início
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "O site calcula dia da semana, mês e data final sozinho."
      - name: durationDays
        label: Duração em dias (a partir do início)
        widget: number
        value_type: int
        min: 0
        required: false
        hint: "0 = evento de um dia. Ex.: início sexta + 2 = termina domingo. Vazio = duração do modelo."
      - name: title
        label: Complemento do título
        widget: string
        required: false
        hint: "Com modelo, o site já monta **SIGLA - Nome completo**. Escreva só o complemento (ex.: Turma 2027, Edição 412). Sem modelo, escreva o título completo."
      - name: status
        label: Status
        widget: select
        required: false
        hint: "Vazio = status do modelo. Depois da data final o site mostra **Realizado** sozinho."
        options:
          - { label: Em breve, value: Em breve }
          - { label: Inscrições abertas, value: Inscrições Abertas }
          - { label: Vagas preenchidas, value: Vagas preenchidas }
          - { label: Realizado, value: Realizado }

      # ── Detalhes exibidos no card ───────────────────────────────────────
      - { name: description, label: Descrição curta, widget: text, required: false, hint: "Texto sob o título no card. Vazio = descrição do modelo." }
      - { name: location, label: Local, widget: string, required: false, hint: "Ex.: Foz do Iguaçu - PR · CEAEC. Vazio = local do modelo." }
      - name: time
        label: Horário
        widget: string
        required: false
        hint: "Ex.: 19h30 às 21h30 · Sexta, sábado e domingo. Vazio = horário do modelo."
        pattern: ['^(?!\s*\d+\s*$)', 'Escreva o horário por extenso (ex.: 19h30 às 21h30). Para a duração, use o campo Duração em dias.']
      - { name: vacancies, label: Vagas, widget: string, required: false, hint: "Ex.: 20 vagas · Turma reduzida. Vazio = vagas do modelo." }

      # ── Preço e inscrição ───────────────────────────────────────────────
      - { name: price, label: Preço, widget: string, required: false, hint: "Ex.: R$ 1.000 · Gratuito. Ignorado quando há Modalidades." }
      - { name: free, label: Gratuito, widget: boolean, required: false, hint: "Ligado = mostra a etiqueta GRATUITO. Desligado = segue o modelo." }
      - name: page
        label: Página do evento no site
        widget: string
        required: false
        hint: "Página interna com os detalhes (ex.: /pages/curso-proep.html). **Quando preenchida, o card leva para ela** — o Link externo e os botões de Modalidades deixam de aparecer no card."
      - name: href
        label: Link externo / inscrição
        widget: string
        required: false
        hint: "Usado pelo card quando **não há** Página do evento (ex.: loja, Sympla). Vazio = link do modelo."
      - { name: buttonLabel, label: Texto do botão, widget: string, required: false, hint: "Ex.: Inscrever-se, Ver detalhes. Vazio = texto do modelo." }
      - name: modalidades
        label: Modalidades (presencial + online)
        widget: list
        required: false
        label_singular: Modalidade
        summary: "{{label}} · {{price}}"
        collapsed: true
        hint: "Use quando houver preço e link **diferentes** por modalidade. Cadastre **2 ou mais** — o card mostra um botão para cada uma. **Se houver Página do evento, os botões não aparecem** (o card leva para a página do curso)."
        fields:
          - { name: label, label: Nome, widget: string, hint: "Ex.: Presencial, Online." }
          - { name: price, label: Preço, widget: string, required: false, hint: "Ex.: R$ 180,00." }
          - { name: href, label: Link de inscrição, widget: string, required: false }
          - { name: buttonLabel, label: Texto do botão, widget: string, required: false, hint: "Ex.: Inscrever presencial." }

      # ── Classificação (opcional; o modelo já define) ────────────────────
      - name: category
        label: Tipo de evento (filtro da agenda)
        widget: relation
        collection: agenda
        file: event_types
        value_field: "types.*.value"
        display_fields: ["types.*.label"]
        required: false
        hint: "Vazio = tipo do modelo. Lista vem de Agenda · Configurações → Tipos."
      - { name: categoryCustom, label: Tipo personalizado, widget: string, required: false, hint: "Só se o tipo não existir na lista. Ex.: Semana de Verbetes — vira filtro automaticamente." }
      - { name: tag, label: Etiqueta no card, widget: string, required: false, hint: "Vazio = etiqueta do modelo ou nome do tipo." }

      # ── Destaque e Home ─────────────────────────────────────────────────
      - { name: featured, label: Destaque na agenda, widget: boolean, required: false, hint: "Mostra em Principais Eventos (agenda) e na Home. Até 3 destaques aparecem." }
      - name: featuredStyle
        label: Estilo do destaque
        widget: select
        required: false
        options:
          - { label: Padrão (claro), value: default }
          - { label: Escuro, value: dark }
          - { label: Dourado, value: gold }
          - { label: Super destaque (borda animada — use no evento principal), value: highlight }
      - { name: featuredDate, label: Data no destaque (texto livre), widget: string, required: false, hint: "Vazio = data formatada automaticamente." }
      - { name: featuredCategory, label: Categoria no destaque (texto livre), widget: string, required: false, hint: "Vazio = etiqueta do evento." }
      - { name: pinHome, label: Fixar na Home, widget: boolean, required: false, hint: "Fixa em Próximas Atividades da Home. Use com Ordem na Home." }
      - { name: homeOrdem, label: Ordem na Home (1 a 5), widget: number, value_type: int, min: 1, max: 5, required: false, hint: "1 = primeiro." }

  - name: agenda
    label: Agenda · Configurações
    description: "Tipos (filtros da agenda) e Modelos (padrões que preenchem os eventos). Mudar um modelo afeta todos os eventos que o usam."
    files:
      - name: event_models
        label: Modelos de eventos
        file: content/agenda/event-models.json
        fields:
          - name: models
            label: Modelos
            widget: list
            label_singular: Modelo
            summary: "{{label}}"
            collapsed: true
            fields:
              - { name: id, label: ID interno, widget: string, pattern: ['^[a-z0-9-]+$', 'Use só letras minúsculas, números e hífen.'], hint: "Ex.: proep, dip, simposio. **Não altere depois de criado** — os eventos usam este ID." }
              - { name: label, label: Nome no CMS, widget: string }
              - { name: acronym, label: Sigla, widget: string, required: false, hint: "Ex.: DIP, PROEP. Com sigla + nome completo, o site monta o título sozinho." }
              - { name: fullName, label: Nome completo, widget: string, required: false, hint: "Ex.: Dinâmica Interassistencial da Paracirurgia." }
              - { name: title, label: Título padrão, widget: string, required: false, hint: "Só se não houver sigla + nome completo." }
              - name: category
                label: Tipo de evento padrão
                widget: relation
                collection: agenda
                file: event_types
                value_field: "types.*.value"
                display_fields: ["types.*.label"]
              - { name: categoryCustom, label: Tipo personalizado padrão, widget: string, required: false }
              - { name: tag, label: Etiqueta padrão, widget: string, required: false }
              - name: status
                label: Status padrão
                widget: select
                required: false
                default: Inscrições Abertas
                options:
                  - { label: Em breve, value: Em breve }
                  - { label: Inscrições abertas, value: Inscrições Abertas }
                  - { label: Vagas preenchidas, value: Vagas preenchidas }
                  - { label: Realizado, value: Realizado }
              - { name: vacancies, label: Vagas padrão, widget: string, required: false }
              - { name: description, label: Descrição padrão, widget: text, required: false }
              - { name: location, label: Local padrão, widget: string, required: false }
              - { name: time, label: Horário padrão, widget: string, required: false, pattern: ['^(?!\s*\d+\s*$)', 'Escreva o horário por extenso. Para a duração, use Duração padrão em dias.'] }
              - { name: price, label: Preço padrão, widget: string, required: false }
              - { name: free, label: Gratuito por padrão, widget: boolean, default: false, required: false }
              - { name: href, label: Link padrão, widget: string, required: false, default: /pages/atividades.html, hint: "Ex.: /pages/curso-proep.html ou link externo." }
              - { name: buttonLabel, label: Texto do botão padrão, widget: string, required: false, default: Ver detalhes }
              - name: modalidades
                label: Modalidades padrão (presencial + online)
                widget: list
                required: false
                label_singular: Modalidade
                summary: "{{label}} · {{price}}"
                collapsed: true
                hint: "Cadastre 2 ou mais para mostrar um botão por modalidade."
                fields:
                  - { name: label, label: Nome, widget: string }
                  - { name: price, label: Preço, widget: string, required: false }
                  - { name: href, label: Link de inscrição, widget: string, required: false }
                  - { name: buttonLabel, label: Texto do botão, widget: string, required: false }
              - { name: durationDays, label: Duração padrão em dias, widget: number, value_type: int, min: 0, required: false, hint: "0 = um dia. Ex.: sexta a domingo = 2." }
      - name: event_types
        label: Tipos de eventos
        file: content/agenda/event-types.json
        fields:
          - name: types
            label: Tipos
            widget: list
            label_singular: Tipo
            summary: "{{label}}"
            collapsed: true
            hint: "Cada tipo vira um filtro na página da agenda."
            fields:
              - { name: value, label: Valor interno, widget: string, pattern: ['^[a-z0-9-]+$', 'Use só letras minúsculas, números e hífen.'], hint: "Ex.: curso-online. Não altere depois de usado." }
              - { name: label, label: Nome singular, widget: string, hint: "Ex.: Programa." }
              - { name: plural, label: Nome no filtro, widget: string, required: false, hint: "Ex.: Programas. Vazio = nome singular." }

  - name: popup
    label: Pop-up de divulgação
    files:
      - name: popup
        label: Pop-up (modal central)
        file: public/popup.json
        media_folder: public/uploads/popup
        public_folder: /uploads/popup
        fields:
          - { name: active, label: Ativar pop-up, widget: boolean, default: false, hint: "Ligue para exibir o pop-up modal centralizado no site. Desligue para ocultar." }
          - name: displayMode
            label: O que exibir
            widget: select
            default: texto
            hint: "Escolha se o pop-up mostra somente texto, somente imagem ou os dois."
            options:
              - { label: Somente texto, value: texto }
              - { label: Imagem + texto, value: imagem-texto }
              - { label: Somente imagem, value: imagem }
          - { name: image, label: Imagem, widget: image, required: false, hint: "Usada nos modos 'Imagem + texto' e 'Somente imagem'. Preferir WEBP otimizado. No modo 'Somente imagem', o clique leva ao Link do botao." }
          - { name: imageAlt, label: Texto alternativo da imagem, widget: string, required: false, hint: "Descreve a imagem para acessibilidade e buscadores." }
          - { name: eyebrow, label: Etiqueta (linha pequena acima do titulo), widget: string, required: false, hint: "Ex.: Marco historico, Vagas abertas, Novidade." }
          - { name: title, label: Titulo, widget: string, required: false }
          - { name: text, label: Texto, widget: text, required: false }
          - { name: buttonLabel, label: Texto do botao, widget: string, required: false, default: Saiba mais }
          - { name: buttonHref, label: Link do botao, widget: string, required: false, hint: "Para onde o botao (ou a imagem, no modo Somente imagem) leva. Ex.: link de inscricao." }
          - { name: cooldownDays, label: Dias sem repetir apos fechar, widget: number, value_type: int, default: 3, min: 0, required: false, hint: "Quantos dias aguardar antes de mostrar de novo para quem ja fechou. Se voce editar o conteudo, o pop-up volta a aparecer mesmo dentro desse prazo." }
          - { name: delaySeconds, label: Segundos ate aparecer, widget: number, value_type: int, default: 2, min: 0, required: false, hint: "Tempo de espera apos abrir a pagina antes do pop-up surgir." }
