<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sveltia CMS · Ectolab</title>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- Pré-visualização dos eventos da agenda (mesma lógica do gerador do site) -->
  <script type="module" src="/admin/preview.js"></script>

  <!-- Atalho fixo para o cadastro guiado de eventos -->
  <style>
    .ecto-quick {
      position: fixed; left: 16px; bottom: 16px; z-index: 2147483000;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px 10px 12px; border-radius: 999px;
      background: #f0a030; color: #08222b; text-decoration: none;
      font: 700 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      box-shadow: 0 10px 24px -8px rgba(0,0,0,.45);
      transition: transform .15s, box-shadow .15s;
    }
    .ecto-quick:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -8px rgba(0,0,0,.55); }
    .ecto-quick:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .ecto-quick b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #08222b; color: #f0a030; font-size: 16px; }
    @media (max-width: 600px) { .ecto-quick span { display: none; } .ecto-quick { padding: 10px; } }
  </style>
  <script>
    // Garante o botão mesmo se o CMS reescrever o <body> ao montar a interface.
    (function () {
      function ensureQuickLink() {
        if (document.querySelector('.ecto-quick')) return;
        var a = document.createElement('a');
        a.className = 'ecto-quick';
        a.href = '/admin/novo-evento.html';
        a.title = 'Cadastro guiado de evento, com prévia ao vivo';
        a.innerHTML = '<b aria-hidden="true">+</b><span>Novo evento guiado</span>';
        document.body.appendChild(a);
      }
      ensureQuickLink();
      new MutationObserver(ensureQuickLink).observe(document.body, { childList: true });
    })();
  </script>
  <script>
    // Rola ate o novo item quando um botao "Add" e clicado em uma lista do CMS.
    // O Sveltia CMS adiciona o item no fim da lista mas nao rola a tela automaticamente,
    // o que pode dar a impressao de bug. Este script corrige esse comportamento.
    (function () {
      function looksLikeAddButton(el) {
        if (!el || el.nodeType !== 1) return false;
        var text = (el.textContent || el.innerText || '').trim().toLowerCase();
        var cls = (el.className || '').toString().toLowerCase();
        return text === 'add' || /\badd\b/.test(cls) || /fab/.test(cls) ||
               (text.indexOf('adicionar') !== -1) || (text.indexOf('novo') !== -1);
      }

      function scrollToListEnd(container) {
        if (!container) return;
        var last = container.lastElementChild;
        if (last && last.scrollIntoView) {
          last.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      document.addEventListener('click', function (e) {
        var target = e.target;
        if (!looksLikeAddButton(target)) {
          // Verifica ancestrais (o clique pode pegar um filho do botao)
          var up = target;
          for (var i = 0; i < 4 && up; i++) {
            if (looksLikeAddButton(up)) { target = up; break; }
            up = up.parentElement;
          }
          if (!looksLikeAddButton(target)) return;
        }

        // Encontra o container de lista mais proximo (pai/avo do botao)
        var container = target.closest('[class*="list"], [class*="field-array"], [class*="array-field"], [role="list"]');
        if (!container) {
          // Fallback: sobe ate achar um container que tenha varios filhos semelhantes
          container = target.parentElement;
          while (container && container.children.length < 2) container = container.parentElement;
        }
        if (!container) return;

        // Espera o novo item ser renderizado pelo Sveltia CMS
        setTimeout(function () { scrollToListEnd(container); }, 500);
      }, true);
    })();
  </script>
</body>
</html>
