<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novo evento · Ectolab</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#08222b; --ink-2:#1a3d4a; --ink-3:#56707a; --line:#d8e3e8; --line-2:#bfd0d7; --paper:#eef5f8; --white:#fff;
      --teal:#155366; --teal-2:#0e3e4d; --teal-soft:#d4e3e8; --teal-glow:#1f87a8;
      --orange:#f0a030; --orange-2:#d68915; --orange-soft:#ffe1b2; --orange-soft2:#f5c878;
      --ok:#11694f; --ok-soft:#e3f4ee; --err:#9b2c2c; --err-soft:#fdeaea;
      --display:"Space Grotesk", system-ui, sans-serif; --sans:"Manrope", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
    a { color: var(--teal); }
    button { font: inherit; }

    /* topo */
    .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 12px clamp(16px, 3vw, 32px); background: var(--teal-2); color: var(--white); }
    .top__brand { font: 700 17px/1 var(--display); letter-spacing: -.02em; }
    .top__brand span { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-left: 8px; }
    .top__right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .top a { color: var(--white); opacity: .85; }
    .chip-user { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 99px; background: rgba(255,255,255,.12); }
    .chip-user img { width: 24px; height: 24px; border-radius: 50%; }
    .linkbtn { background: none; border: 0; color: var(--white); opacity: .8; cursor: pointer; text-decoration: underline; padding: 0; }

    /* etapas */
    .steps { display: flex; gap: 6px; padding: 14px clamp(16px, 3vw, 32px); overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--white); }
    .step { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 99px; border: 1px solid var(--line); background: var(--white); color: var(--ink-3); cursor: pointer; font-size: 13px; font-weight: 600; }
    .step b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); font: 700 11px/1 var(--mono); color: var(--ink-3); }
    .step.done { color: var(--ink-2); }
    .step.done b { background: var(--teal); color: var(--white); }
    .step.on { border-color: var(--orange); color: var(--ink); box-shadow: 0 0 0 2px var(--orange-soft); }
    .step.on b { background: var(--orange); color: var(--ink); }

    /* layout */
    .layout { display: grid; grid-template-columns: minmax(340px, 480px) minmax(0, 1fr); gap: clamp(16px, 2.5vw, 32px); padding: clamp(16px, 2.5vw, 28px) clamp(16px, 3vw, 32px) 48px; align-items: start; max-width: 1600px; margin: 0 auto; }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 2.4vw, 28px); box-shadow: 0 18px 40px -30px rgba(8,34,43,.4); }
    .panel h1 { font: 600 26px/1.15 var(--display); letter-spacing: -.02em; margin: 0 0 4px; }
    .panel .lead { margin: 0 0 22px; color: var(--ink-3); font-size: 14px; }
    .eyebrow { font: 600 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--orange-2); margin: 0 0 10px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field > label, .field > .label { font-weight: 700; font-size: 14px; }
    .field .opt { font-weight: 500; color: var(--ink-3); font-size: 12.5px; margin-left: 4px; }
    .field .help { font-size: 12.5px; color: var(--ink-3); }
    input[type=text], input[type=date], input[type=number], input[type=url], textarea, select {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--white); color: var(--ink); font: 15px/1.3 var(--sans);
    }
    textarea { min-height: 88px; resize: vertical; line-height: 1.45; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--teal-glow); box-shadow: 0 0 0 3px rgba(31,135,168,.18); }
    input::placeholder, textarea::placeholder { color: #8ea3ab; }
    .field.invalid input, .field.invalid select { border-color: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
    .err-msg { color: var(--err); font-size: 12.5px; font-weight: 600; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice { padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 99px; background: var(--white); cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
    .choice.on { background: var(--teal); border-color: var(--teal); color: var(--white); }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
    .toggle input { width: 20px; height: 20px; accent-color: var(--teal); }
    .toggle span small { display: block; color: var(--ink-3); font-weight: 500; font-size: 12.5px; }
    .toggle span { font-weight: 700; font-size: 14px; }

    .model-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 340px; overflow: auto; padding: 2px; }
    .model-card { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .model-card b { font: 700 11px/1.2 var(--mono); letter-spacing: .08em; color: var(--teal); }
    .model-card span { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
    .model-card.on { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange); background: #fffaf1; }
    .model-card.none span { font-style: italic; }

    .mods { display: flex; flex-direction: column; gap: 10px; }
    .mod { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; }
    .mod .full { grid-column: 1 / -1; }
    .mod .rm { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--err); cursor: pointer; font-size: 12px; font-weight: 700; }
    details.more { border: 1px dashed var(--line-2); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; }
    details.more summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
    details.more[open] summary { margin-bottom: 12px; }

    .nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--white); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; font-size: 14.5px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--white); }
    .btn.go { background: var(--orange); border-color: var(--orange); color: var(--ink); }
    .btn.small { padding: 7px 12px; font-size: 13px; }
    .muted { color: var(--ink-3); font-size: 13px; }

    .review { display: grid; grid-template-columns: 140px 1fr; gap: 8px 14px; margin: 0 0 16px; font-size: 14px; }
    .review dt { font: 600 10.5px/1.7 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
    .review dd { margin: 0; word-break: break-word; }
    .review dd.inh { color: var(--ink-3); font-style: italic; }
    .notice { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; }
    .notice.ok { background: var(--ok-soft); color: var(--ok); }
    .notice.err { background: var(--err-soft); color: var(--err); }
    .notice.warn { background: #fff4e0; border: 1px solid var(--orange-soft2); }
    .notice ul { margin: 6px 0 0; padding-left: 18px; }

    /* prévia */
    .preview { position: sticky; top: 132px; display: flex; flex-direction: column; gap: 10px; container-type: inline-size; }
    .preview__bar { display: flex; align-items: center; gap: 10px; font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
    .preview__bar i { width: 8px; height: 8px; border-radius: 50%; background: #2fb67c; box-shadow: 0 0 0 4px rgba(47,182,124,.18); }
    .preview__frame { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--paper); max-height: calc(100vh - 170px); overflow-y: auto; }

    /* login */
    .gate { max-width: 460px; margin: 10vh auto; text-align: center; }
    .gate .panel { padding: 36px 32px; }
    .gate h1 { margin-bottom: 8px; }

    .hidden { display: none !important; }
    .toggle-preview { display: none; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .preview { position: static; }
      .preview__frame { max-height: none; }
      .toggle-preview { display: inline-flex; }
      .preview.collapsed .preview__frame { display: none; }
    }
    @media (max-width: 480px) { .row2, .model-pick, .mod { grid-template-columns: 1fr; } .review { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="top__brand">Ectolab <span>Novo evento</span></div>
    <div class="top__right">
      <a href="/admin/#/collections/eventos">Voltar ao CMS</a>
      <span id="user" class="hidden"></span>
    </div>
  </header>

  <main id="app">
    <div class="gate" id="gate">
      <div class="panel">
        <p class="eyebrow">Cadastro guiado</p>
        <h1>Novo evento na agenda</h1>
        <p class="lead" id="gate-msg">Entre com a mesma conta do GitHub que você usa no CMS.</p>
        <button class="btn primary" id="login">Entrar com GitHub</button>
      </div>
    </div>
  </main>

  <script type="module" src="/admin/novo-evento.js"></script>
</body>
</html>
